
spring.application.name=social-media-backend

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:retrosocial}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
