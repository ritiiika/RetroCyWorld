spring.application.name=social-media-backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:retrosocial;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-value-please}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
